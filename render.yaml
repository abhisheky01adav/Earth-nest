services:
  - type: web
    name: earthnest-eco-store
    runtime: node
    plan: free
    buildCommand: unzip -o "EarthNest-GitHub-Upload (1).zip" -d app
    startCommand: cd app && if [ ! -f db.json ]; then cp db.example.json db.json; fi && node server.js
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
